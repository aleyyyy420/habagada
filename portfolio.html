<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --ink: #1a1a1a;
    --accent: #c94f2c;
    --muted: #8a8070;
    --card: #ffffff;
    --border: #ddd8ce;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 0 0 80px 0;
  }

  /* ── HEADER / ID CARD ── */
  header {
    background: var(--ink);
    color: var(--cream);
    padding: 60px 48px 48px;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.18;
  }

  .id-card {
    display: flex;
    align-items: flex-start;
    gap: 36px;
    max-width: 860px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .avatar {
    width: 90px; height: 90px;
    border-radius: 4px;
    background: #333;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.2s;
    overflow: hidden;
  }
  .avatar:hover { border-color: #fff; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .id-info { flex: 1; }

  .label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .editable-name {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 5vw, 48px);
    line-height: 1.1;
    color: #fff;
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    cursor: text;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .editable-name:hover, .editable-name:focus {
    border-bottom-color: rgba(255,255,255,0.3);
  }
  .editable-name::placeholder { color: rgba(255,255,255,0.3); }

  .meta-row {
    display: flex;
    gap: 32px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .meta-field { display: flex; flex-direction: column; gap: 4px; }

  .editable-meta {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    background: transparent;
    border: none;
    outline: none;
    border-bottom: 1px dashed rgba(255,255,255,0.2);
    padding: 2px 0;
    width: 160px;
    transition: border-color 0.2s;
  }
  .editable-meta:hover, .editable-meta:focus {
    border-bottom-color: rgba(255,255,255,0.6);
  }
  .editable-meta::placeholder { color: rgba(255,255,255,0.25); }

  .edit-hint {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.1em;
    margin-top: 20px;
  }

  /* ── MAIN CONTENT ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 24px 0;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .section-title {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--ink);
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-tag {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 8px;
    border-radius: 2px;
  }

  /* ── PROJECT GRID ── */
  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 56px;
  }

  .project-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    position: relative;
    transition: box-shadow 0.2s, transform 0.2s;
    cursor: default;
  }
  .project-card:hover {
    box-shadow: 4px 4px 0 var(--ink);
    transform: translate(-2px, -2px);
  }

  .project-number {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .project-title-input {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--ink);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 6px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  .project-title-input:focus { border-bottom-color: var(--accent); }
  .project-title-input::placeholder { color: #ccc; }

  .project-desc-input {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    resize: none;
    line-height: 1.6;
    height: 60px;
  }
  .project-desc-input::placeholder { color: #ccc; }

  .project-link-input {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  .project-link-input::placeholder { color: #ddd; }

  .delete-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: none;
    border: none;
    color: #ddd;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 5px;
    border-radius: 2px;
    transition: color 0.15s, background 0.15s;
  }
  .delete-btn:hover { color: var(--accent); background: #fef0ec; }

  /* ── ADD BUTTON ── */
  .add-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    padding: 14px 20px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    cursor: pointer;
    width: 100%;
    transition: border-color 0.2s, color 0.2s;
    margin-bottom: 56px;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-top: 20px;
  }

  /* Avatar upload input (hidden) */
  #avatar-upload { display: none; }

  @media (max-width: 500px) {
    header { padding: 40px 24px 32px; }
    .id-card { flex-direction: column; gap: 20px; }
    .meta-row { gap: 16px; }
    .editable-meta { width: 130px; }
  }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="id-card">
    <div class="avatar" id="avatarBox" title="Click to upload photo">
      <span id="avatarEmoji">👤</span>
      <img id="avatarImg" src="" alt="" style="display:none">
    </div>
    <input type="file" id="avatar-upload" accept="image/*">

    <div class="id-info">
      <div class="label">Portfolio</div>
      <input class="editable-name" type="text" placeholder="Your Name" maxlength="60" spellcheck="false">

      <div class="meta-row">
        <div class="meta-field">
          <div class="label">School ID</div>
          <input class="editable-meta" type="text" placeholder="e.g. 2024-00123" spellcheck="false">
        </div>
        <div class="meta-field">
          <div class="label">School</div>
          <input class="editable-meta" type="text" placeholder="School / University" spellcheck="false">
        </div>
        <div class="meta-field">
          <div class="label">Course / Year</div>
          <input class="editable-meta" type="text" placeholder="e.g. CS · Year 2" spellcheck="false">
        </div>
      </div>

      <div class="edit-hint">↑ click any field to edit</div>
    </div>
  </div>
</header>

<!-- ── MAIN ── -->
<main>

  <!-- CODING PROJECTS -->
  <div class="section-header">
    <div class="section-title">Coding Projects</div>
    <div class="section-line"></div>
    <div class="section-tag">dev</div>
  </div>

  <div class="project-grid" id="coding-grid"></div>
  <button class="add-btn" onclick="addCard('coding-grid')">＋ &nbsp;add project</button>

  <!-- GRAPHIC DESIGN PROJECTS -->
  <div class="section-header">
    <div class="section-title">Graphic Design</div>
    <div class="section-line"></div>
    <div class="section-tag">design</div>
  </div>

  <div class="project-grid" id="design-grid"></div>
  <button class="add-btn" onclick="addCard('design-grid')">＋ &nbsp;add project</button>

  <footer>made with ♥ — click any field to edit</footer>
</main>

<script>
  let codingCount = 0;
  let designCount = 0;

  function addCard(gridId) {
    const grid = document.getElementById(gridId);
    const isDesign = gridId === 'design-grid';
    const count = isDesign ? ++designCount : ++codingCount;

    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <button class="delete-btn" onclick="this.parentElement.remove()" title="Remove">✕</button>
      <div class="project-number">${String(count).padStart(2,'0')}</div>
      <input class="project-title-input" type="text" placeholder="${isDesign ? 'Design title' : 'Project name'}" spellcheck="false">
      <textarea class="project-desc-input" placeholder="Brief description — what it does, tools used, etc."></textarea>
      <input class="project-link-input" type="text" placeholder="${isDesign ? 'Behance / Dribbble / link' : 'GitHub / live demo link'}">
    `;
    grid.appendChild(card);
    card.querySelector('.project-title-input').focus();
  }

  // Seed with 2 blank cards each
  addCard('coding-grid');
  addCard('coding-grid');
  addCard('design-grid');
  addCard('design-grid');

  // Avatar upload
  const avatarBox = document.getElementById('avatarBox');
  const avatarUpload = document.getElementById('avatar-upload');
  const avatarImg = document.getElementById('avatarImg');
  const avatarEmoji = document.getElementById('avatarEmoji');

  avatarBox.addEventListener('click', () => avatarUpload.click());
  avatarUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      avatarImg.src = ev.target.result;
      avatarImg.style.display = 'block';
      avatarEmoji.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
